# Tells Cloudflare how to deploy this Worker on every push (Workers Builds).
# IMPORTANT: this file is in a PUBLIC repo, so it must contain NO secrets.
# Your Serper key and SYSTEM_PROMPT_* stay as dashboard Secrets — they persist
# across deploys and are never committed here.

name = "firstfor"
main = "worker.js"
compatibility_date = "2025-01-01"

# Smart Placement (free): this worker is upstream-bound — it spends its time
# calling Gemini / Serper / Jina, not talking to the browser. Cloudflare runs
# it in a colo near those backends, and only relocates when that actually cuts
# latency. Pure win for an I/O-bound worker.
[placement]
mode = "smart"

# Workers AI  -> env.AI
[ai]
binding = "AI"

# KV cache    -> env.COMPANY_CACHE
[[kv_namespaces]]
binding = "COMPANY_CACHE"
id = "009a5e0753044f7c8d5d1ade4135eba2"

# Workers Logs (so the DIAG/console.log lines show in Observability -> Logs).
# Defined here so it survives every deploy.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
