<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Financial PDF Analyzer</title>
</head>
<body>

<h1>Financial PDF Analyzer</h1>
<hr>

<p>
  <label for="pdf-file">PDF file:</label><br>
  <input type="file" id="pdf-file" accept=".pdf">
</p>

<p id="file-status"></p>

<p>
  <button id="analyze-btn" disabled>Analyze</button>
</p>

<p id="status"></p>

<hr>

<pre id="output" style="white-space:pre-wrap;word-break:break-word;max-width:900px;"></pre>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const WORKER_URL = 'https://firstfor.learn-rahul-rai.workers.dev';

  const fileEl     = document.getElementById('pdf-file');
  const fileStatus = document.getElementById('file-status');
  const analyzeBtn = document.getElementById('analyze-btn');
  const statusEl   = document.getElementById('status');
  const outputEl   = document.getElementById('output');

  let extractedText = '';

  fileEl.addEventListener('change', () => {
    const file = fileEl.files[0];
    if (!file) return;
    if (file.type !== 'application/pdf') {
      fileStatus.textContent = 'Error: not a PDF.';
      return;
    }
    fileStatus.textContent = 'Reading...';
    extractText(file);
  });

  async function extractText(file) {
    try {
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      const parts = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const tc   = await page.getTextContent();
        parts.push(tc.items.map(x => x.str).join(' '));
      }
      const MAX_CHARS = 20000;
      extractedText = parts.join('\n\n')
        .replace(/[^\S\n]+/g, ' ')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
      const truncated = extractedText.length > MAX_CHARS;
      if (truncated) extractedText = extractedText.slice(0, MAX_CHARS);
      fileStatus.textContent = pdf.numPages + ' page(s) loaded, ' + extractedText.length.toLocaleString() + ' chars' + (truncated ? ' (truncated to fit model limits)' : '') + '.';
      analyzeBtn.disabled = false;
    } catch (e) {
      fileStatus.textContent = 'Error reading PDF: ' + e.message;
    }
  }

  analyzeBtn.addEventListener('click', async () => {
    analyzeBtn.disabled = true;
    outputEl.textContent = '';
    statusEl.textContent = 'Analyzing...';

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text: extractedText }),
      });

      const data = await res.json();

      if (!res.ok || data.error) {
        throw new Error(data.error || res.statusText);
      }

      outputEl.textContent = data.result;
      statusEl.textContent = 'Done.';
    } catch (e) {
      statusEl.textContent = 'Error: ' + e.message;
    } finally {
      analyzeBtn.disabled = false;
    }
  });
</script>

</body>
</html>
