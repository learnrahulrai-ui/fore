<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Financial PDF Analyzer</title>
</head>
<body>

<h1>Financial PDF Analyzer</h1>
<hr>

<p>
  <label for="pdf-file">PDF file:</label><br>
  <input type="file" id="pdf-file" accept=".pdf">
</p>

<p id="file-status"></p>

<p>
  <button id="analyze-btn" disabled>Analyze</button>
  &nbsp;<input type="checkbox" id="fresh">
  <label for="fresh">force refresh (ignore cache)</label>
</p>

<p id="status"></p>

<div id="results" style="display:none">
  <hr>
  <p id="company-line"></p>
  <p id="diag-line" style="color:#999;font-size:0.75em;font-family:monospace;"></p>

  <h3>Documents Found</h3>
  <div id="out-search" style="font-size:0.85em;max-width:900px;"></div>

  <h3>Verified Company Facts</h3>
  <p id="grounding-note" style="color:#555;font-size:0.85em;"></p>
  <p id="sources-line" style="font-size:0.85em;"></p>
  <pre id="out-research" style="white-space:pre-wrap;word-break:break-word;max-width:900px;"></pre>

  <h3>PDF Analysis</h3>
  <pre id="out-analysis" style="white-space:pre-wrap;word-break:break-word;max-width:900px;"></pre>

  <h3>Final Report</h3>
  <pre id="out-report" style="white-space:pre-wrap;word-break:break-word;max-width:900px;"></pre>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const WORKER_URL = 'https://firstfor.learn-rahul-rai.workers.dev';

  const fileEl      = document.getElementById('pdf-file');
  const fileStatus  = document.getElementById('file-status');
  const analyzeBtn  = document.getElementById('analyze-btn');
  const statusEl    = document.getElementById('status');
  const resultsEl   = document.getElementById('results');
  const companyLine = document.getElementById('company-line');
  const diagLine    = document.getElementById('diag-line');
  const outSearch   = document.getElementById('out-search');
  const groundNote  = document.getElementById('grounding-note');
  const sourcesLine = document.getElementById('sources-line');
  const outResearch = document.getElementById('out-research');
  const outAnalysis = document.getElementById('out-analysis');
  const outReport   = document.getElementById('out-report');

  const freshEl = document.getElementById('fresh');
  let extractedText = '';
  let headText = '';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function safeUrl(u) {
    try {
      const p = new URL(u);
      return (p.protocol === 'http:' || p.protocol === 'https:') ? esc(u) : '#';
    } catch { return '#'; }
  }

  fileEl.addEventListener('change', () => {
    const file = fileEl.files[0];
    if (!file) return;
    if (file.type !== 'application/pdf') { fileStatus.textContent = 'Error: not a PDF.'; return; }
    fileStatus.textContent = 'Reading...';
    extractText(file);
  });

  async function extractText(file) {
    try {
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      const parts = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const tc   = await page.getTextContent();
        parts.push(tc.items.map(x => x.str).join(' '));
      }
      const MAX_CHARS = 20000;
      const full = parts.join('\n\n').replace(/[^\S\n]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
      const start = Math.floor(full.length * 0.30);
      extractedText = full.slice(start, start + MAX_CHARS);
      headText = full.slice(0, 2000); // cover page, for company-name detection
      fileStatus.textContent = pdf.numPages + ' page(s) loaded, ' + extractedText.length.toLocaleString() + ' chars.';
      analyzeBtn.disabled = false;
    } catch (e) {
      fileStatus.textContent = 'Error reading PDF: ' + e.message;
    }
  }

  analyzeBtn.addEventListener('click', async () => {
    analyzeBtn.disabled = true;
    resultsEl.style.display = 'none';
    statusEl.textContent = 'Searching the web, checking facts, analyzing... (may take 1-3 minutes)';

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text: extractedText, head: headText, fresh: freshEl.checked }),
      });

      const data = await res.json();

      if (!res.ok || data.error) throw new Error(data.error || res.statusText);

      companyLine.textContent = 'Company: ' + data.company + (data.cached ? ' (from cache)' : ' (freshly checked)');

      const dropped = data.dropped_count || 0;
      groundNote.textContent = dropped > 0
        ? dropped + ' proposed claim(s) were dropped because the quote could not be found in any source. (High = retrieval is weak for this company.)'
        : 'Every fact below was checked against its source quote.';

      const srcs = data.sources || [];
      if (srcs.length) {
        sourcesLine.innerHTML = 'Sources checked: ' +
          srcs.map(s => '<a href="' + safeUrl(s.url) + '" target="_blank" rel="noopener">' + esc(s.trust) + '</a>').join(', ');
      } else {
        sourcesLine.textContent = 'Sources checked: none could be retrieved.';
      }

      const hits = data.search || [];
      if (hits.length) {
        // Flat list of documents found — no query strings exposed.
        outSearch.innerHTML = hits.map(h =>
          '<div style="margin:0.2em 0 0.5em;">' +
          '<a href="' + safeUrl(h.url) + '" target="_blank" rel="noopener">' + esc(h.title || h.url) + '</a><br>' +
          '<span style="color:#555;">' + esc(h.snippet) + '</span></div>'
        ).join('');
      } else {
        const via = (data.diag && data.diag.search_via) || '';
        const msg = {
          'no-key': 'No web search ran: the worker has no SERPER_API_KEY secret set.',
          'serper-empty': 'Serper key IS set but returned no results — the key is likely invalid or out of quota.',
          'cache': 'Served from cache (no fresh search). Tick "force refresh" to re-search.',
        }[via] || 'No web search ran.';
        outSearch.textContent = msg;
      }

      if (data.diag) {
        diagLine.textContent = 'diag: ' + JSON.stringify(data.diag);
      }

      outResearch.textContent = data.research;
      outAnalysis.textContent = data.analysis;
      outReport.textContent   = data.report;
      resultsEl.style.display = 'block';
      statusEl.textContent = 'Done.';
    } catch (e) {
      statusEl.textContent = 'Error: ' + e.message;
    } finally {
      analyzeBtn.disabled = false;
    }
  });
</script>

</body>
</html>
