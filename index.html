<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Financial PDF Analyzer</title>
</head>
<body>

<h1>Financial PDF Analyzer</h1>
<hr>

<p>
  <label for="api-key">API Key:</label><br>
  <input type="password" id="api-key" size="60" placeholder="sk-ant-...">
  &nbsp;<input type="checkbox" id="remember" onchange="forgetKey(this)">
  <label for="remember">remember in this browser</label>
</p>

<p>
  <label for="pdf-file">PDF file:</label><br>
  <input type="file" id="pdf-file" accept=".pdf">
</p>

<p id="file-status"></p>

<p>
  <button id="analyze-btn" disabled>Analyze</button>
</p>

<p id="status"></p>

<hr>

<pre id="output" style="white-space:pre-wrap;word-break:break-word;max-width:900px;"></pre>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const SYSTEM_PROMPT = `[PROMPT GOES HERE]`;

  const apiKeyEl   = document.getElementById('api-key');
  const rememberEl = document.getElementById('remember');
  const fileEl     = document.getElementById('pdf-file');
  const fileStatus = document.getElementById('file-status');
  const analyzeBtn = document.getElementById('analyze-btn');
  const statusEl   = document.getElementById('status');
  const outputEl   = document.getElementById('output');

  const saved = localStorage.getItem('api_key');
  if (saved) { apiKeyEl.value = saved; rememberEl.checked = true; }

  function forgetKey(cb) {
    if (!cb.checked) localStorage.removeItem('api_key');
  }

  apiKeyEl.addEventListener('input', checkReady);

  let extractedText = '';

  fileEl.addEventListener('change', () => {
    const file = fileEl.files[0];
    if (!file) return;
    if (file.type !== 'application/pdf') {
      fileStatus.textContent = 'Error: not a PDF.';
      return;
    }
    fileStatus.textContent = 'Reading...';
    extractText(file);
  });

  async function extractText(file) {
    try {
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      const parts = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const tc   = await page.getTextContent();
        parts.push(tc.items.map(x => x.str).join(' '));
      }
      extractedText = parts.join('\n\n');
      fileStatus.textContent = pdf.numPages + ' page(s) loaded, ' + extractedText.length.toLocaleString() + ' chars.';
      checkReady();
    } catch (e) {
      fileStatus.textContent = 'Error reading PDF: ' + e.message;
    }
  }

  function checkReady() {
    analyzeBtn.disabled = !(extractedText && apiKeyEl.value.trim());
  }

  analyzeBtn.addEventListener('click', async () => {
    const key = apiKeyEl.value.trim();
    if (rememberEl.checked) localStorage.setItem('api_key', key);

    analyzeBtn.disabled = true;
    outputEl.textContent = '';
    statusEl.textContent = 'Sending to API...';

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'content-type': 'application/json',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-opus-4-8',
          max_tokens: 4096,
          system: SYSTEM_PROMPT,
          messages: [{ role: 'user', content: extractedText }]
        })
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error?.message || res.statusText);
      }

      const data = await res.json();
      outputEl.textContent = data.content?.[0]?.text ?? '(empty response)';
      statusEl.textContent = 'Done.';
    } catch (e) {
      statusEl.textContent = 'Error: ' + e.message;
    } finally {
      checkReady();
    }
  });
</script>

</body>
</html>
